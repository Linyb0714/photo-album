name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 显式带上 dev 依赖（@tauri-apps/cli 在 devDependencies 里），并打印诊断信息
      - name: Install frontend deps
        shell: bash
        run: |
          node -v
          npm -v
          npm ci --include=dev || npm install --include=dev
          echo "--- node_modules/.bin 里的 tauri ---"
          ls node_modules/.bin | grep -i tauri || echo "!! 未找到 tauri 可执行文件"
          echo "--- @tauri-apps/cli 解析结果 ---"
          npm ls @tauri-apps/cli || true

      - name: Build frontend
        shell: bash
        run: npm run build

      # 直接用 CLI 的入口文件，避免依赖 PATH / .bin 解析
      - name: Build Windows installer (NSIS)
        shell: bash
        run: |
          if [ -f node_modules/@tauri-apps/cli/tauri.js ]; then
            node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis
          else
            npm run tauri build -- --bundles nsis
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAlbum-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
          if-no-files-found: error
