name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 显式带上 dev 依赖（@tauri-apps/cli 在 devDependencies 里），并打印诊断信息
      # 注意：这里不能用 `|| npm install` 兜底。npm 失败时只会打印 "Exit handler never called!"，
      # 真实原因（如 registry 不可达导致的 ETIMEDOUT）只写在 <cache>/_logs 的 debug log 里，
      # 兜底既会把真实错误盖掉，又会把失败耗时翻倍。
      - name: Install frontend deps
        shell: bash
        run: |
          node -v
          npm -v
          npm config get registry
          npm ci --include=dev --no-audit --no-fund
          echo "--- node_modules/.bin 里的 tauri ---"
          ls node_modules/.bin | grep -i tauri || echo "!! 未找到 tauri 可执行文件"
          echo "--- @tauri-apps/cli 解析结果 ---"
          npm ls @tauri-apps/cli || true

      # npm 的报错信息常常与真实原因无关，失败时把 debug log 打出来
      - name: Dump npm debug logs
        if: failure()
        shell: bash
        run: |
          echo "=== npm registry ==="
          npm config get registry
          CACHE_DIR="$(npm config get cache | tr '\\' '/')"
          echo "=== npm cache: $CACHE_DIR ==="
          for f in "$CACHE_DIR"/_logs/*debug-0.log; do
            [ -f "$f" ] || continue
            echo "----- $f -----"
            grep -iE "error|ETIMEDOUT|ECONNREFUSED|ENOTFOUND|EAI_AGAIN|attempt .* failed|http fetch" "$f" | tail -60 || true
          done

      - name: Build frontend
        shell: bash
        run: npm run build

      # 直接用 CLI 的入口文件，避免依赖 PATH / .bin 解析
      - name: Build Windows installer (NSIS)
        shell: bash
        run: |
          if [ -f node_modules/@tauri-apps/cli/tauri.js ]; then
            node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis
          else
            npm run tauri build -- --bundles nsis
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAlbum-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
          if-no-files-found: error
